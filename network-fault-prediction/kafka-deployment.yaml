apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: wurstmeister/kafka:latest
          env:
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://localhost:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL
              value: "PLAINTEXT"
            - name: KAFKA_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LISTENER_PORT
              value: "9093"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "localhost:2181"
          ports:
            - containerPort: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  ports:
    - port: 9093
      targetPort: 9093
  selector:
    app: kafka
