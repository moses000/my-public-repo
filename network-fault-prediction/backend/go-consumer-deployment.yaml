apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-consumer
spec:
  replicas: 3 # You can scale this based on your needs
  selector:
    matchLabels:
      app: go-consumer
  template:
    metadata:
      labels:
        app: go-consumer
    spec:
      containers:
        - name: go-consumer
          image: your-docker-repo/go-kafka-consumer:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKER
              value: "kafka:9093" # Kafka service created above
---
apiVersion: v1
kind: Service
metadata:
  name: go-consumer
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: go-consumer
